<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#11131a" />
  <title>Lsh1902の主页</title>
  <meta name="description" content="Lsh1902 的个人主页 - 二次元爱好者，安静看番，认真生活。" />
  <!-- 预连接外部资源，减少连接建立延迟（jsDelivr 分发背景与音乐，img.cdn1.vip 仅存头像/图标） -->
  <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://img.cdn1.vip" crossorigin />
  <link rel="dns-prefetch" href="https://gcore.jsdelivr.net" />
  <link rel="dns-prefetch" href="https://img.cdn1.vip" />
  <link rel="icon" href="https://img.cdn1.vip/i/69c38360c02af_1774420832.webp" type="image/x-icon">
  <link rel="shortcut icon" href="https://img.cdn1.vip/i/69c38360c02af_1774420832.webp" type="image/x-icon">
  <!-- 预加载首屏关键资源：头像（LCP 元素），仅此一张 -->
  <link rel="preload" as="image" href="https://img.cdn1.vip/i/69c380c30640c_1774420163.jpg" />
  <style>
    :root {
      color-scheme: dark;    /* 系统深色模式：原生控件使用深色渲染，避免表单/滚动条变亮 */
      --ink: #f4ecdd;        /* 米白主文字 */
      --ink-dim: #cfc6b4;    /* 次级文字：提亮一档，提升高透卡片下的对比度 */
      --accent: #ff7a45;     /* 暖橙强调 */
      --accent-2: #ffb454;   /* 琥珀 */
      --bili: #fb7299;       /* B站品牌粉 */
      --pixiv: #0096fa;      /* Pixiv 品牌蓝 */
      --love: #ff7a45;       /* 番单：沿用暖橙强调色 */
      --gh: #6e5494;         /* GitHub 品牌紫 */
      --tools: #ffb454;      /* 工具箱：沿用琥珀橙 */
      --panel: rgba(17, 19, 26, 0.12);
      --panel-border: rgba(255, 255, 255, 0.1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      color-scheme: dark;    /* 与 :root 保持一致，body 层原生控件同样渲染为深色 */
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 28px);
      position: relative;
      /* 防止Dark Reader修改body背景 */
      background: transparent !important;
    }

    /* 背景轮播样式 - 关键修复：添加!important和Dark Reader豁免 */
    .bg-slider {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: -9999 !important; /* 强制底层显示，避免被遮挡 */
      /* 豁免Dark Reader修改 */
      --darkreader-inline-bgimage: none !important;
      background: transparent !important;
    }
    .bg-slide {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-size: cover !important;
      background-position: center !important;
      opacity: 0 !important;
      transition: opacity 1.5s ease-in-out !important;
      /* 关键：禁止Dark Reader反转图片颜色 */
      filter: none !important;
      --darkreader-inline-filter: none !important;
    }
    .bg-slide.active {
      opacity: 1 !important; /* 强制显示激活的轮播图 */
    }

    /* 深色渐变遮罩：压暗轮播图，突出卡片、保证文字对比度 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(0, 0, 0, 0.05) 0%, transparent 55%),
        linear-gradient(180deg, rgba(10, 10, 14, 0.16) 0%, rgba(10, 10, 14, 0.09) 45%, rgba(10, 10, 14, 0.22) 100%);
      pointer-events: none;
      z-index: -1;
      /* 豁免Dark Reader修改 */
      --darkreader-inline-bgimage: none !important;
      opacity: 1 !important;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    /* ===== 主卡：磁带放映面板 ===== */
    .card {
      position: relative;
      background: var(--panel);
      backdrop-filter: blur(2px) saturate(1.15);
      -webkit-backdrop-filter: blur(2px) saturate(1.15);
      border-radius: 28px;
      padding: 30px 28px 26px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      text-align: center;
      /* 全局文字阴影基准：近实描边 + 中距柔和 + 远距扩散（子元素各自的自定义阴影优先） */
      text-shadow:
        0 0 1px rgba(0, 0, 0, 0.85),
        0 1px 2px rgba(0, 0, 0, 0.8),
        0 2px 8px rgba(0, 0, 0, 0.6),
        0 0 18px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      /* 适配Dark Reader的卡片背景 */
      --darkreader-inline-bgcolor: rgba(17, 19, 26, 0.12) !important;
      --darkreader-inline-border: 1px solid rgba(90, 90, 110, 0.4) !important;
    }

    /* 顶部胶片齿孔条 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.14) 0 10px,
        transparent 10px 22px
      );
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      --darkreader-inline-bgimage: none !important;
      filter: none !important;
    }

    /* 左上角 REC 标 / 右上角编号 */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2px 0 18px;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 600;
      color: var(--ink-dim);
      text-transform: uppercase;
      /* 近实描边 + 中距柔和 + 远距扩散 */
      text-shadow:
        0 0 1px rgba(0, 0, 0, 0.95),
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 2px 9px rgba(0, 0, 0, 0.72),
        0 0 20px rgba(0, 0, 0, 0.48);
      --darkreader-inline-color: #cfc6b4 !important;
    }
    .card-top .rec {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-2);
      font-weight: 700;
      --darkreader-inline-color: #ffb454 !important;
    }
    .card-top .rec::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(255, 122, 69, 0.9);
      --darkreader-inline-bgcolor: #ff7a45 !important;
      --darkreader-inline-boxshadow: 0 0 8px rgba(255, 122, 69, 0.9) !important;
    }

    /* ===== 头像：唱片风格，外环缓转 ===== */
    .avatar-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 4px auto 18px;
    }
    .avatar-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--ink), var(--accent));
      animation: spin 16s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      opacity: 0.9;
      --darkreader-inline-bgimage: none !important;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(244, 236, 221, 0.85);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 0 6px rgba(255, 122, 69, 0.14);
      filter: none !important;
      --darkreader-inline-border: 3px solid rgba(244, 236, 221, 0.85) !important;
    }

    /* ===== 名字与签名 ===== */
    .name {
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--ink);
      margin-bottom: 6px;
      line-height: 1.2;
      /* 关键标题：轻微描边 + 近实描边 + 中距柔和 + 远距扩散 */
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.45);
      paint-order: stroke fill;
      text-shadow:
        0 0 1px rgba(0, 0, 0, 1),
        0 1px 2px rgba(0, 0, 0, 0.95),
        0 2px 7px rgba(0, 0, 0, 0.85),
        0 4px 18px rgba(0, 0, 0, 0.7),
        0 0 32px rgba(0, 0, 0, 0.55);
      --darkreader-inline-color: #f4ecdd !important;
    }
    .name .dot {
      color: var(--accent);
      --darkreader-inline-color: #ff7a45 !important;
    }
    .sign {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--ink-dim);
      margin-bottom: 22px;
      text-shadow:
        0 0 1px rgba(0, 0, 0, 0.95),
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 2px 10px rgba(0, 0, 0, 0.75),
        0 0 22px rgba(0, 0, 0, 0.5);
      --darkreader-inline-color: #cfc6b4 !important;
    }

    /* ===== 标签：编号胶囊 ===== */
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 8px;
      background: rgba(255, 122, 69, 0.12);
      color: var(--ink);
      border: 1px solid rgba(255, 122, 69, 0.22);
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      text-shadow:
        0 0 1px rgba(0, 0, 0, 0.95),
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 2px 9px rgba(0, 0, 0, 0.72),
        0 0 20px rgba(0, 0, 0, 0.48);
      --darkreader-inline-bgcolor: rgba(255, 122, 69, 0.12) !important;
      --darkreader-inline-color: #f4ecdd !important;
      --darkreader-inline-border: 1px solid rgba(255, 122, 69, 0.22) !important;
    }
    .tag .no {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      --darkreader-inline-color: #ff7a45 !important;
    }

    /* ===== 链接：目录式条目 ===== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }
    /* ===== 液态玻璃按钮：中性玻璃基底，各按钮由下方主题色 tint 覆盖 ===== */
    .btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      /* 玻璃体：斜向半透明渐变 + 顶部高光 */
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.13) 0%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0.09) 100%
      );
      backdrop-filter: blur(10px) saturate(1.5);
      -webkit-backdrop-filter: blur(10px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, 0.18);
      min-height: 48px;
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.26),
        inset 0 -1px 0 rgba(0, 0, 0, 0.14);
      transition: transform 0.25s var(--ease-out), background 0.25s, box-shadow 0.25s, border-color 0.25s;
      /* 按钮文字：仅加强阴影（自发光与文字颜色保持不变） */
      text-shadow:
        0 0 1px rgba(0, 0, 0, 0.95),
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 2px 10px rgba(0, 0, 0, 0.75),
        0 0 22px rgba(0, 0, 0, 0.5);
      --darkreader-inline-bgimage: none !important;
      --darkreader-inline-bgcolor: rgba(255, 255, 255, 0.09) !important;
      --darkreader-inline-color: #f4ecdd !important;
      --darkreader-inline-border: 1px solid rgba(255, 255, 255, 0.18) !important;
    }
    /* 液态光泽扫过层：hover 自左向右掠过，不拦截点击、不遮挡文字 */
    .btn::before {
      content: '';
      position: absolute;
      top: -12%;
      left: -70%;
      width: 55%;
      height: 124%;
      background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.34) 50%, transparent 100%);
      transform: skewX(-18deg);
      opacity: 0;
      pointer-events: none;
      transition: left 0.65s var(--ease-out), opacity 0.3s;
      z-index: 1;
    }
    .btn:hover::before { left: 135%; opacity: 1; }
    .btn .idx {
      position: relative;
      z-index: 2;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--ink-dim);
      width: 20px;
      text-align: left;
      --darkreader-inline-color: #cfc6b4 !important;
    }
    .btn .label {
      position: relative;
      z-index: 2;
      flex: 1;
      text-align: left;
    }
    .btn .arrow {
      position: relative;
      z-index: 2;
      font-size: 16px;
      color: var(--ink-dim);
      transition: transform 0.25s var(--ease-out), color 0.25s;
      --darkreader-inline-color: #cfc6b4 !important;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.2) 0%,
        rgba(255, 255, 255, 0.08) 50%,
        rgba(255, 255, 255, 0.13) 100%
      );
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(0, 0, 0, 0.16);
    }
    .btn:hover .arrow {
      transform: translateX(3px);
      color: var(--accent);
      --darkreader-inline-color: #ff7a45 !important;
    }
    .btn:active {
      transform: translateY(0) scale(0.99);
    }
    /* ===== 主题色 tinted 液态玻璃：5 个主按钮各按品牌色着色 ===== */
    /* 01 B站：品牌粉 #fb7299 */
    .btn-bilibili {
      background: linear-gradient(135deg, rgba(251, 114, 153, 0.34) 0%, rgba(251, 114, 153, 0.14) 52%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(251, 114, 153, 0.55);
      color: #fff;
      /* 自发光：主题色外光晕（两层）+ 内发光微光，配 btn-glow-bilibili 呼吸动画 */
      box-shadow:
        0 0 10px rgba(251, 114, 153, 0.38),
        0 0 26px rgba(251, 114, 153, 0.22),
        0 6px 20px rgba(0, 0, 0, 0.26),
        inset 0 0 12px rgba(251, 114, 153, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1px 0 rgba(0, 0, 0, 0.14);
      animation: btn-glow-bilibili 3.6s ease-in-out infinite alternate;
      --darkreader-inline-boxshadow:
        0 0 10px rgba(251, 114, 153, 0.38),
        0 0 26px rgba(251, 114, 153, 0.22),
        0 6px 20px rgba(0, 0, 0, 0.26),
        inset 0 0 12px rgba(251, 114, 153, 0.20) !important;
      --darkreader-inline-bgcolor: rgba(251, 114, 153, 0.30) !important;
      --darkreader-inline-color: #fff !important;
      --darkreader-inline-border: 1px solid rgba(251, 114, 153, 0.55) !important;
    }
    .btn-bilibili:hover {
      background: linear-gradient(135deg, rgba(251, 114, 153, 0.48) 0%, rgba(251, 114, 153, 0.22) 52%, rgba(255, 255, 255, 0.10) 100%);
      border-color: rgba(251, 114, 153, 0.80);
      /* hover/active：自发光增强（停用呼吸动画，改用静态高亮，避免动画覆盖增强值） */
      animation: none;
      box-shadow:
        0 0 22px rgba(251, 114, 153, 0.70),
        0 0 48px rgba(251, 114, 153, 0.40),
        0 14px 30px rgba(251, 114, 153, 0.40),
        inset 0 0 22px rgba(251, 114, 153, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.46),
        inset 0 -1px 0 rgba(0, 0, 0, 0.16);
      --darkreader-inline-boxshadow:
        0 0 22px rgba(251, 114, 153, 0.70),
        0 0 48px rgba(251, 114, 153, 0.40),
        0 14px 30px rgba(251, 114, 153, 0.40),
        inset 0 0 22px rgba(251, 114, 153, 0.34) !important;
      --darkreader-inline-bgcolor: rgba(251, 114, 153, 0.42) !important;
    }
    .btn-bilibili .idx, .btn-bilibili .arrow { color: rgba(255, 219, 231, 0.92); }
    .btn-bilibili:hover .arrow { color: #fff; }

    /* 02 Pixiv：品牌蓝 #0096fa */
    .btn-pixiv {
      background: linear-gradient(135deg, rgba(0, 150, 250, 0.34) 0%, rgba(0, 150, 250, 0.14) 52%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(0, 150, 250, 0.55);
      color: #fff;
      /* 自发光：主题色外光晕（两层）+ 内发光微光，配 btn-glow-pixiv 呼吸动画 */
      box-shadow:
        0 0 10px rgba(0, 150, 250, 0.40),
        0 0 26px rgba(0, 150, 250, 0.24),
        0 6px 20px rgba(0, 0, 0, 0.26),
        inset 0 0 12px rgba(0, 150, 250, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1px 0 rgba(0, 0, 0, 0.14);
      animation: btn-glow-pixiv 3.6s ease-in-out infinite alternate;
      --darkreader-inline-boxshadow:
        0 0 10px rgba(0, 150, 250, 0.40),
        0 0 26px rgba(0, 150, 250, 0.24),
        0 6px 20px rgba(0, 0, 0, 0.26),
        inset 0 0 12px rgba(0, 150, 250, 0.22) !important;
      --darkreader-inline-bgcolor: rgba(0, 150, 250, 0.30) !important;
      --darkreader-inline-color: #fff !important;
      --darkreader-inline-border: 1px solid rgba(0, 150, 250, 0.55) !important;
    }
    .btn-pixiv:hover {
      background: linear-gradient(135deg, rgba(0, 150, 250, 0.48) 0%, rgba(0, 150, 250, 0.22) 52%, rgba(255, 255, 255, 0.10) 100%);
      border-color: rgba(0, 150, 250, 0.80);
      /* hover/active：自发光增强（停用呼吸动画，改用静态高亮，避免动画覆盖增强值） */
      animation: none;
      box-shadow:
        0 0 22px rgba(0, 150, 250, 0.72),
        0 0 48px rgba(0, 150, 250, 0.42),
        0 14px 30px rgba(0, 150, 250, 0.42),
        inset 0 0 22px rgba(0, 150, 250, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.46),
        inset 0 -1px 0 rgba(0, 0, 0, 0.16);
      --darkreader-inline-boxshadow:
        0 0 22px rgba(0, 150, 250, 0.72),
        0 0 48px rgba(0, 150, 250, 0.42),
        0 14px 30px rgba(0, 150, 250, 0.42),
        inset 0 0 22px rgba(0, 150, 250, 0.36) !important;
      --darkreader-inline-bgcolor: rgba(0, 150, 250, 0.42) !important;
    }
    .btn-pixiv .idx, .btn-pixiv .arrow { color: rgba(208, 234, 255, 0.92); }
    .btn-pixiv:hover .arrow { color: #fff; }

    /* 03 我的番单：沿用暖橙主题色变量 --accent */
    .btn-love {
      background: linear-gradient(135deg, rgba(255, 122, 69, 0.34) 0%, rgba(255, 122, 69, 0.14) 52%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(255, 122, 69, 0.55);
      color: #fff;
      /* 自发光：主题色外光晕（两层）+ 内发光微光，配 btn-glow-love 呼吸动画 */
      box-shadow:
        0 0 10px rgba(255, 122, 69, 0.40),
        0 0 26px rgba(255, 122, 69, 0.24),
        0 6px 20px rgba(0, 0, 0, 0.26),
        inset 0 0 12px rgba(255, 122, 69, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1px 0 rgba(0, 0, 0, 0.14);
      animation: btn-glow-love 3.6s ease-in-out infinite alternate;
      --darkreader-inline-boxshadow:
        0 0 10px rgba(255, 122, 69, 0.40),
        0 0 26px rgba(255, 122, 69, 0.24),
        0 6px 20px rgba(0, 0, 0, 0.26),
        inset 0 0 12px rgba(255, 122, 69, 0.22) !important;
      --darkreader-inline-bgcolor: rgba(255, 122, 69, 0.30) !important;
      --darkreader-inline-color: #fff !important;
      --darkreader-inline-border: 1px solid rgba(255, 122, 69, 0.55) !important;
    }
    .btn-love:hover {
      background: linear-gradient(135deg, rgba(255, 122, 69, 0.48) 0%, rgba(255, 122, 69, 0.22) 52%, rgba(255, 255, 255, 0.10) 100%);
      border-color: rgba(255, 122, 69, 0.80);

    .control-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));

      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(255, 122, 69, 0.4);
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s, background 0.2s;
      --darkreader-inline-bgimage: none !important;
      --darkreader-inline-bgcolor: #ff7a45 !important;
      --darkreader-inline-color: #16130c !important;
    }

      transform: scale(1.08);
      box-shadow: 0 8px 22px rgba(255, 122, 69, 0.55);
    }
    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn.mini-btn {
      width: 34px;
      height: 34px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink-dim);
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      --darkreader-inline-bgcolor: rgba(255, 255, 255, 0.08) !important;
      --darkreader-inline-color: #cfc6b4 !important;
      --darkreader-inline-border: 1px solid rgba(255, 255, 255, 0.12) !important;

      background: rgba(255, 122, 69, 0.14);
      border-color: rgba(255, 122, 69, 0.4);
      --darkreader-inline-color: #ff7a45 !important;
      --darkreader-inline-bgcolor: rgba(255, 122, 69, 0.14) !important;
    }
    /* 均衡器动效 */
    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      width: 20px;
      opacity: 0.55;
    }
    .eq span {
      width: 3px;
      background: var(--accent-2);
      border-radius: 2px;
      animation: eq-bounce 1.1s ease-in-out infinite;
    }
    .eq span:nth-child(1) { height: 8px; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 16px; animation-delay: 0.18s; }
    .eq span:nth-child(3) { height: 11px; animation-delay: 0.36s; }
    .eq span:nth-child(4) { height: 6px; animation-delay: 0.1s; }
    @keyframes eq-bounce {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1); }
    }

    /* ===== 播放进度条：轨道 + 滑块 + 时间 ===== */
    .progress-area {
      margin-top: 14px;
    }
    .progress {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      /* 已播放部分通过 --progress 变量动态填充 */
      background: linear-gradient(to right, var(--accent-2) 0%, var(--accent-2) var(--progress, 0%), rgba(255, 255, 255, 0.14) var(--progress, 0%));
      outline: none;
      cursor: pointer;
      /* Dark Reader 豁免：保留自绘轨道颜色 */
      --darkreader-inline-background: linear-gradient(to right, #ffb454 0%, #ffb454 var(--progress, 0%), rgba(255, 255, 255, 0.14) var(--progress, 0%)) !important;
    }
    .progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid #16130c;
      box-shadow: 0 0 10px rgba(255, 180, 84, 0.55);
      transition: transform 0.15s var(--ease-out);
      --darkreader-inline-background: #ffb454 !important;
      --darkreader-inline-border: 2px solid #16130c !important;
      --darkreader-inline-boxshadow: 0 0 10px rgba(255, 180, 84, 0.55) !important;
    }
    .progress::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    .progress:focus-visible {
      box-shadow: 0 0 0 3px rgba(255, 180, 84, 0.3);
    }
    .progress::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      --darkreader-inline-background: rgba(255, 255, 255, 0.14) !important;
    }
    /* Firefox 依据 input value 自动填充已播放部分 */
    .progress::-moz-range-progress {
      height: 4px;
      border-radius: 999px;
      background: var(--accent-2);
      --darkreader-inline-background: #ffb454 !important;
    }
    .progress::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid #16130c;
      box-shadow: 0 0 10px rgba(255, 180, 84, 0.55);
      --darkreader-inline-background: #ffb454 !important;
      --darkreader-inline-border: 2px solid #16130c !important;
      --darkreader-inline-boxshadow: 0 0 10px rgba(255, 180, 84, 0.55) !important;

    const XOR_KEY = 'Lsh1902-Tape-XOR-Key!@#2026';
    // 将加密字节流按密钥逐字节异或，还原为原始媒体数据
    function xorDecode(buf) {
      const key = new TextEncoder().encode(XOR_KEY);
      const out = new Uint8Array(buf.byteLength);
      for (let i = 0; i < buf.byteLength; i++) {
        out[i] = buf[i] ^ key[i % key.length];
      }
      return out;

    // fetch 加密资源 -> XOR 解码 -> Blob 对象 URL，供 <audio> / <img> 使用（背景音乐/轮播均走此通道）
    async function fetchDecoded(url, mime) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('fetch failed ' + res.status);
      const raw = new Uint8Array(await res.arrayBuffer());
      return URL.createObjectURL(new Blob([xorDecode(raw)], { type: mime }));
    }

      if (!bgm.duration) return;
      isSeeking = true;
      const t = (progress.value / 100) * bgm.duration;
      bgm.currentTime = t;
      timeCurrent.textContent = formatTime(t);
    }

    // —— 4. 曲目加载与播放控制（加密资源：fetch -> XOR 解码 -> Blob URL 赋给 <audio>） ——
    let trackLoadSeq = 0;     // loadTrack 递增序号，用于丢弃过期的异步加载结果（快速切歌时不串台）
    async function loadTrack(idx, autoplay) {
      current = (idx + playlist.length) % playlist.length;
      const item = playlist[current];
      trackName.textContent = item.name;
      trackMeta.textContent = item.meta;
      resetProgress(); // 切换曲目时重置进度条
      if (typeof updateSongActive === 'function') updateSongActive();
      const seq = ++trackLoadSeq;
      try {
        const url = await fetchDecoded(item.src, 'audio/mp4');
        if (seq !== trackLoadSeq) return;   // 期间又切了歌，丢弃本次结果
        if (bgm.src && bgm.src.startsWith('blob:')) URL.revokeObjectURL(bgm.src); // 释放上一首的 Blob
        bgm.src = url;
        if (autoplay) {
          // 部分浏览器对自动播放有限制，捕获 reject 避免报错
          const p = bgm.play();
          if (p && p.catch) p.catch(() => {});
        }
      } catch (e) {
        // 资源加载/解码失败：静默，页面其余功能不受影响
      }
    }
    function setPlaying(state) {
      isPlaying = state;
      playBtn.textContent = state ? '⏸' : '▶';
      playBtn.setAttribute('aria-pressed', String(state));
      // 均衡器随播放状态启停
      eqBars.forEach((b) => { b.style.animationPlayState = state ? 'running' : 'paused'; });
      if (typeof updateSongActive === 'function') updateSongActive();
    }
    function togglePlay() {
      if (!bgm.src) { loadTrack(0, true); setPlaying(true); return; }
      if (isPlaying) {
        bgm.pause();
        setPlaying(false);
      } else {
        const p = bgm.play();
        if (p && p.catch) p.catch(() => {});
        setPlaying(true);
      }
    }

    // —— 5. 事件绑定 ——
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => { loadTrack(current - 1, true); setPlaying(true); });
    nextBtn.addEventListener('click', () => { loadTrack(current + 1, true); setPlaying(true); });
    // 一首播完自动切下一首，形成连续播放列表
    bgm.addEventListener('ended', () => { loadTrack(current + 1, true); setPlaying(true); });
    // 元数据就绪 / 播放过程中实时同步进度条（拖动期间跳过）
    bgm.addEventListener('loadedmetadata', updateProgressUI);
    bgm.addEventListener('timeupdate', () => { if (!isSeeking) updateProgressUI(); });
    // 点击 / 拖动进度条 seek；松开时结束拖动状态
    progress.addEventListener('input', onSeek);
    progress.addEventListener('change', () => { isSeeking = false; });

    // —— 6. 初始化：载入第一首曲目信息（不自动播放，但立即 fetch 解密并开始加载音频） ——
    loadTrack(0, false);

    // "我的番单"按钮：展开/收起番单面板（魔法禁书目录 & 超电磁炮系列，附B站链接）
    const favoriteBtn = document.getElementById('favoriteBtn');
    const favPanel = document.getElementById('favPanel');
    if (favoriteBtn && favPanel) {
      favoriteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const opening = favPanel.hidden;
        favPanel.hidden = !opening;
        favoriteBtn.setAttribute('aria-expanded', String(opening));
        favoriteBtn.querySelector('.label').textContent = opening ? '收起番单' : '我的番单';
        favoriteBtn.querySelector('.arrow').textContent = opening ? '↑' : '→';
      });
    }

    // 完整歌曲列表：渲染所有曲目，支持点击任意歌曲直接切换
    function updateSongActive() {
      if (!songList) return;
      const items = songList.querySelectorAll('.song-item');
      items.forEach((el, i) => {
        const on = (i === current);
        el.classList.toggle('active', on);
        const st = el.querySelector('.song-state');
        if (st) st.textContent = (on && isPlaying) ? '♪' : '';
      });
    }
    function renderPlaylist() {
      if (!songList) return;
      songList.innerHTML = '';
      playlist.forEach((t, i) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'song-item';
        btn.setAttribute('aria-label', '播放 ' + t.name);
        btn.innerHTML =
          '<span class="song-idx">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="song-name">' + t.name + '</span>' +
          '<span class="song-meta">' + t.meta + '</span>' +
          '<span class="song-state"></span>';
        btn.addEventListener('click', () => {
          if (i === current) {
            // 点击当前曲目：播放/暂停切换
            if (isPlaying) {
              bgm.pause();
              setPlaying(false);
            } else {
              const p = bgm.play();
              if (p && p.catch) p.catch(() => {});
              setPlaying(true);
            }
          } else {
            loadTrack(i, true);
            setPlaying(true);
          }
          updateSongActive();
        });
        li.appendChild(btn);
        songList.appendChild(li);
      });
      updateSongActive();
    }
    renderPlaylist();

    // 背景轮播逻辑（懒加载 + 加密资源解码版）
    const slides = document.querySelectorAll('.bg-slide');
    const bgCache = {};          // 已解码背景 Blob URL 缓存，避免重复请求
    let currentSlide = 0;
    let timer = null;
    const SLIDE_INTERVAL = 5000;
    // 移动端背景集：视口 <=768px 时使用竖屏集 data-bg-m，桌面端保持横屏集 data-bg
    const mobileBgMq = window.matchMedia('(max-width: 768px)');
    const isMobileBg = () => mobileBgMq.matches;
    function bgSrcFor(s) {
      return (isMobileBg() && s.dataset.bgM) ? s.dataset.bgM : s.dataset.bg;
    }

    // fetch 加密背景 -> XOR 解码 -> Blob URL（带缓存）
    async function loadBg(src) {
      if (bgCache[src]) return bgCache[src];
      const url = await fetchDecoded(src, 'image/webp');
      bgCache[src] = url;
      return url;
    }

    // 异步应用背景：仅对带背景 URL 的幻灯片设置，避免无背景被覆盖成 url('undefined')
    async function applyBg(idx) {
      const s = slides[idx];
      if (!s) return;
      const src = bgSrcFor(s);
      if (!src || s.dataset.loaded === src) return;
      try {
        const url = await loadBg(src);
        if (s.dataset.loaded === src) return;   // 等待期间已处理
        s.style.backgroundImage = "url('" + url + "')";
        s.dataset.loaded = src;
      } catch (e) { /* 加载失败静默：保持无背景，页面不崩 */ }
    }

    function goTo(idx) {
      applyBg(idx);
      slides.forEach((s, i) => s.classList.toggle('active', i === idx));
      currentSlide = idx;
      // 预先解码缓存下一张，切换时无需等待
      const next = slides[(idx + 1) % slides.length];
      if (next) {
        const ns = bgSrcFor(next);
        if (ns && next.dataset.loaded !== ns) loadBg(ns);
      }
    }

    function nextSlide() {
      goTo((currentSlide + 1) % slides.length);
    }

    function startSlider() {
      if (timer) return;
      timer = setInterval(nextSlide, SLIDE_INTERVAL);
    }

    function stopSlider() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    if (slides.length > 0) {
      // 首屏显示 bg1，轮播正常从 bg1 开始
      goTo(0);
      startSlider();
      // 页面在后台时暂停轮播，减少无谓的图片加载与性能消耗
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopSlider(); else startSlider();
      });
      // 视口宽度跨过 768px 断点时：清空已加载背景并切到对应背景集，从当前序号重新开始
      function switchBgSet() {
        stopSlider();
        slides.forEach((s) => {
          s.dataset.loaded = '';
          s.style.backgroundImage = '';
        });
        goTo(currentSlide);
        startSlider();
      }
      if (mobileBgMq.addEventListener) mobileBgMq.addEventListener('change', switchBgSet);
      else if (mobileBgMq.addListener) mobileBgMq.addListener(switchBgSet);
    }

    // ═══════════ 公告栏模块 ═══════════
    // 从仓库根 announcements.md 拉取公告（fastly jsDelivr + 时间戳绕缓存），
    // 以 "## 日期 标题" 为分隔拆分多条，正文用 marked 渲染（加载失败时用内置迷你渲染器兜底）
    (function () {
      const announceToggle = document.getElementById('announceToggle');
      const announceBody = document.getElementById('announceBody');
      if (!announceToggle || !announceBody) return;

      announceToggle.addEventListener('click', () => {
        const opening = announceBody.hidden;
        announceBody.hidden = !opening;
        announceToggle.setAttribute('aria-expanded', String(opening));
        const arrow = announceToggle.querySelector('.arrow');
        if (arrow) arrow.textContent = opening ? '收起 ▾' : '展开 ▸';
      });

      const MD_URL = 'https://gcore.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/announcements.md?t=' + Date.now();

      // 迷你 Markdown 渲染器：marked 不可用时的降级（先转义 HTML，支持标题/加粗/斜体/链接/代码/列表/引用/代码块/分隔线）
      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function miniRender(src) {
        const lines = escapeHtml(src).split(/\n/);
        const out = [];
        let inList = null, inCode = false, codeBuf = [];
        const flushList = () => { if (inList) { out.push('</' + inList + '>'); inList = null; } };
        for (const raw of lines) {
          let line = raw;
          if (inCode) {
            if (/^\s*```\s*$/.test(line)) { inCode = false; out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>'); codeBuf = []; }
            else codeBuf.push(line);
            continue;
          }
          if (/^\s*```/.test(line)) { flushList(); inCode = true; codeBuf = []; continue; }
          line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                     .replace(/\*(.+?)\*/g, '<em>$1</em>')
                     .replace(/`([^`]+)`/g, '<code>$1</code>')
                     .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
          const h = line.match(/^(#{1,6})\s+(.*)$/);
          if (h) { flushList(); out.push('<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>'); continue; }
          const q = line.match(/^>\s?(.*)$/);
          if (q) { flushList(); out.push('<blockquote>' + q[1] + '</blockquote>'); continue; }
          // 注意：行先被 escapeHtml 转义，因此引用符 ">" 已变为 "&gt;"
          if (q) {} else { const q2 = line.match(/^&gt;\s?(.*)$/); if (q2) { flushList(); out.push('<blockquote>' + q2[1] + '</blockquote>'); continue; } }
          const ul = line.match(/^\s*[-*+]\s+(.*)$/);
          if (ul) { if (inList !== 'ul') { flushList(); out.push('<ul>'); inList = 'ul'; } out.push('<li>' + ul[1] + '</li>'); continue; }
          const ol = line.match(/^\s*\d+\.\s+(.*)$/);
          if (ol) { if (inList !== 'ol') { flushList(); out.push('<ol>'); inList = 'ol'; } out.push('<li>' + ol[1] + '</li>'); continue; }
          flushList();
          if (/^\s*---+/.test(line)) { out.push('<hr>'); continue; }
          if (/^\s*$/.test(line)) { continue; }
          out.push('<p>' + line + '</p>');
        }
        if (inCode) out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>');
        flushList();
        return out.join('\n');
      }
      function renderMd(src) {
        if (typeof marked !== 'undefined' && marked && marked.parse) {
          try { return marked.parse(src); } catch (e) { /* 内部错误走兜底 */ }
        }
        return miniRender(src);
      }

      // 拆分：每个 "## " 开头的行为一条公告；标题行首 token 若为日期则单独提取
      function parseAnnouncements(md) {
        const items = [];
        let cur = null;
        for (const line of md.split(/\r?\n/)) {
          const m = line.match(/^##\s+(.*)$/);
          if (m) {
            if (cur) items.push(cur);
            cur = { rawTitle: m[1].trim(), body: [] };
          } else if (cur) {
            cur.body.push(line);
          }
        }
        if (cur) items.push(cur);
        return items.map((it) => {
          let date = '', title = it.rawTitle;
          const dm = it.rawTitle.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/);
          if (dm) { date = dm[1]; title = dm[2] || date; }
          while (it.body.length && /^\s*$/.test(it.body[0])) it.body.shift();
          while (it.body.length && /^\s*$/.test(it.body[it.body.length - 1])) it.body.pop();
          return { date, title, body: it.body.join('\n') };
        }).filter((it) => it.title || it.body.trim());
      }

      async function loadAnnouncements() {
        announceBody.innerHTML = '<div class="announce-loading">加载公告中…</div>';
        let md = '';
        try {
          const res = await fetch(MD_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          md = await res.text();
        } catch (e) {
          announceBody.innerHTML = '<div class="announce-error">公告加载失败：' + escapeHtml(String((e && e.message) || e)) + '</div>';
          return;
        }
        const items = parseAnnouncements(md);
        if (!items.length) {
          announceBody.innerHTML = '<div class="announce-empty">暂无公告</div>';
          return;
        }
        announceBody.innerHTML = '';
        for (const it of items) {
          const det = document.createElement('details');
          det.className = 'announce-item';
          const sum = document.createElement('summary');
          if (it.date) {
            const d = document.createElement('span');
            d.className = 'announce-date';
            d.textContent = it.date;
            sum.appendChild(d);
          }
          const t = document.createElement('span');
          t.className = 'announce-title';
          t.textContent = it.title;
          sum.appendChild(t);
          const content = document.createElement('div');
          content.className = 'announce-content';
          content.innerHTML = it.body ? renderMd(it.body) : '';
          det.appendChild(sum);
          det.appendChild(content);
          announceBody.appendChild(det);
        }
      }

      loadAnnouncements();
    })();
  </script>
</body>
</html>
