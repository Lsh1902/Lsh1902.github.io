<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#11131a" />
  <title>Lsh1902の主页</title>
  <meta name="description" content="Lsh1902 的个人主页 - 二次元爱好者，安静看番，认真生活。" />
  <!-- 预连接外部资源，减少连接建立延迟（jsDelivr 分发背景与音乐，img.cdn1.vip 仅存头像/图标） -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://img.cdn1.vip" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="dns-prefetch" href="https://img.cdn1.vip" />
  <link rel="icon" href="https://img.cdn1.vip/i/69c38360c02af_1774420832.webp" type="image/x-icon">
  <link rel="shortcut icon" href="https://img.cdn1.vip/i/69c38360c02af_1774420832.webp" type="image/x-icon">
  <!-- 预加载首屏关键资源：头像（LCP 元素），仅此一张 -->
  <link rel="preload" as="image" href="https://img.cdn1.vip/i/69c380c30640c_1774420163.jpg" />
  <style>
    :root {
      color-scheme: dark;    /* 系统深色模式：原生控件使用深色渲染，避免表单/滚动条变亮 */
      --ink: #f4ecdd;        /* 米白主文字 */
      --ink-dim: #b8ad97;    /* 次级文字 */
      --accent: #ff7a45;     /* 暖橙强调 */
      --accent-2: #ffb454;   /* 琥珀 */
      --bili: #fb7299;       /* B站品牌粉 */
      --panel: rgba(17, 19, 26, 0.82);
      --panel-border: rgba(255, 255, 255, 0.1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      color-scheme: dark;    /* 与 :root 保持一致，body 层原生控件同样渲染为深色 */
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 28px);
      position: relative;
      /* 防止Dark Reader修改body背景 */
      background: transparent !important;
    }

    /* 背景轮播样式 - 关键修复：添加!important和Dark Reader豁免 */
    .bg-slider {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: -9999 !important; /* 强制底层显示，避免被遮挡 */
      /* 豁免Dark Reader修改 */
      --darkreader-inline-bgimage: none !important;
      background: transparent !important;
    }
    .bg-slide {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-size: cover !important;
      background-position: center !important;
      opacity: 0 !important;
      transition: opacity 1.5s ease-in-out !important;
      /* 关键：禁止Dark Reader反转图片颜色 */
      filter: none !important;
      --darkreader-inline-filter: none !important;
    }
    .bg-slide.active {
      opacity: 1 !important; /* 强制显示激活的轮播图 */
    }

    /* 深色渐变遮罩：压暗轮播图，突出卡片、保证文字对比度 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(0, 0, 0, 0.22) 0%, transparent 55%),
        linear-gradient(180deg, rgba(10, 10, 14, 0.55) 0%, rgba(10, 10, 14, 0.32) 45%, rgba(10, 10, 14, 0.72) 100%);
      pointer-events: none;
      z-index: -1;
      /* 豁免Dark Reader修改 */
      --darkreader-inline-bgimage: none !important;
      opacity: 1 !important;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    /* ===== 主卡：磁带放映面板 ===== */
    .card {
      position: relative;
      background: var(--panel);
      backdrop-filter: blur(20px) saturate(1.15);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);
      border-radius: 28px;
      padding: 30px 28px 26px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      text-align: center;
      overflow: hidden;
      /* 适配Dark Reader的卡片背景 */
      --darkreader-inline-bgcolor: rgba(17, 19, 26, 0.82) !important;
      --darkreader-inline-border: 1px solid rgba(90, 90, 110, 0.4) !important;
    }

    /* 顶部胶片齿孔条 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.14) 0 10px,
        transparent 10px 22px
      );
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      --darkreader-inline-bgimage: none !important;
      filter: none !important;
    }

    /* 左上角 REC 标 / 右上角编号 */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2px 0 18px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--ink-dim);
      text-transform: uppercase;
      --darkreader-inline-color: #b8ad97 !important;
    }
    .card-top .rec {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-2);
      font-weight: 700;
      --darkreader-inline-color: #ffb454 !important;
    }
    .card-top .rec::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(255, 122, 69, 0.9);
      --darkreader-inline-bgcolor: #ff7a45 !important;
      --darkreader-inline-boxshadow: 0 0 8px rgba(255, 122, 69, 0.9) !important;
    }

    /* ===== 头像：唱片风格，外环缓转 ===== */
    .avatar-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 4px auto 18px;
    }
    .avatar-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--ink), var(--accent));
      animation: spin 16s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      opacity: 0.9;
      --darkreader-inline-bgimage: none !important;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(244, 236, 221, 0.85);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 0 6px rgba(255, 122, 69, 0.14);
      filter: none !important;
      --darkreader-inline-border: 3px solid rgba(244, 236, 221, 0.85) !important;
    }

    /* ===== 名字与签名 ===== */
    .name {
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--ink);
      margin-bottom: 6px;
      line-height: 1.2;
      --darkreader-inline-color: #f4ecdd !important;
    }
    .name .dot {
      color: var(--accent);
      --darkreader-inline-color: #ff7a45 !important;
    }
    .sign {
      font-size: 13.5px;
      letter-spacing: 2px;
      color: var(--ink-dim);
      margin-bottom: 22px;
      --darkreader-inline-color: #b8ad97 !important;
    }

    /* ===== 标签：编号胶囊 ===== */
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 8px;
      background: rgba(255, 122, 69, 0.12);
      color: var(--ink);
      border: 1px solid rgba(255, 122, 69, 0.22);
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      --darkreader-inline-bgcolor: rgba(255, 122, 69, 0.12) !important;
      --darkreader-inline-color: #f4ecdd !important;
      --darkreader-inline-border: 1px solid rgba(255, 122, 69, 0.22) !important;
    }
    .tag .no {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      --darkreader-inline-color: #ff7a45 !important;
    }

    /* ===== 链接：目录式条目 ===== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 48px;
      transition: transform 0.25s var(--ease-out), background 0.25s, box-shadow 0.25s, border-color 0.25s;
      --darkreader-inline-bgcolor: rgba(255, 255, 255, 0.06) !important;
      --darkreader-inline-color: #f4ecdd !important;
      --darkreader-inline-border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    .btn .idx {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--ink-dim);
      width: 20px;
      text-align: left;
      --darkreader-inline-color: #b8ad97 !important;
    }
    .btn .label {
      flex: 1;
      text-align: left;
    }
    .btn .arrow {
      font-size: 16px;
      color: var(--ink-dim);
      transition: transform 0.25s var(--ease-out), color 0.25s;
      --darkreader-inline-color: #b8ad97 !important;
    }
    .btn:hover {
      transform: translateX(4px);
      background: rgba(255, 122, 69, 0.14);
      border-color: rgba(255, 122, 69, 0.4);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    .btn:hover .arrow {
      transform: translateX(3px);
      color: var(--accent);
      --darkreader-inline-color: #ff7a45 !important;
    }
    .btn:active {
      transform: translateX(1px) scale(0.99);
    }
    /* B站品牌粉突出 */
    .btn-bilibili {
      background: linear-gradient(135deg, var(--bili), #f93d78);
      border: none;
      color: #fff;
      box-shadow: 0 8px 20px rgba(251, 114, 153, 0.3);
      --darkreader-inline-bgimage: none !important;
      --darkreader-inline-bgcolor: #fb7299 !important;
      --darkreader-inline-color: #fff !important;
    }
    .btn-bilibili:hover {
      background: linear-gradient(135deg, #fb85a8, #f42e6f);
      transform: translateY(-2px) translateX(0);
      box-shadow: 0 12px 26px rgba(251, 114, 153, 0.4);
      --darkreader-inline-bgcolor: #fb85a8 !important;
    }
    .btn-bilibili .idx, .btn-bilibili .arrow { color: rgba(255, 255, 255, 0.85); }
    .btn-bilibili:hover .arrow { color: #fff; }

    /* ===== 番单面板：紧贴「我的番单」按钮下方展开 ===== */
    .fav-panel {
      margin: 2px 0 14px;
      padding: 16px 14px 8px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
      --darkreader-inline-bgcolor: rgba(255, 255, 255, 0.05) !important;
      --darkreader-inline-border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    .fav-group-title {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--accent-2);
      margin: 4px 0 8px;
      --darkreader-inline-color: #ffb454 !important;
    }
    .fav-group + .fav-group { margin-top: 10px; }
    .fav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--bili), #f93d78);
      border: none;
      color: #fff;
      box-shadow: 0 4px 12px rgba(251, 114, 153, 0.25);
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s;
      --darkreader-inline-bgimage: none !important;
      --darkreader-inline-bgcolor: #fb7299 !important;
      --darkreader-inline-color: #fff !important;
    }
    .fav-item:hover {
      transform: translateX(3px);
      box-shadow: 0 6px 16px rgba(251, 114, 153, 0.4);
      --darkreader-inline-bgcolor: #fb85a8 !important;
    }
    .fav-idx {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.75);
    }
    .fav-name { flex: 1; }
    .fav-item .arrow { color: rgba(255, 255, 255, 0.85); font-size: 15px; }

    /* ===== 音乐播放器：NOW PLAYING 条 ===== */
    .music-player {
      border-top: 1px dashed rgba(255, 255, 255, 0.14);
      padding-top: 16px;
      --darkreader-inline-border: 1px dashed rgba(255, 255, 255, 0.14) !important;
    }
    .now-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--accent-2);
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      --darkreader-inline-color: #ffb454 !important;
    }
    .music-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .music-title {
      flex: 1;
      min-width: 0; /* 允许 flex 收缩，防止长标题把控件挤出卡片 */
      text-align: left;
      font-size: 14px;
      color: var(--ink);
      font-weight: 600;
      --darkreader-inline-color: #f4ecdd !important;
    }
    .music-title small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-dim);
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      --darkreader-inline-color: #b8ad97 !important;
    }
    #trackName {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .control-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #16130c;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(255, 122, 69, 0.4);
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s, background 0.2s;
      --darkreader-inline-bgimage: none !important;
      --darkreader-inline-bgcolor: #ff7a45 !important;
      --darkreader-inline-color: #16130c !important;
    }
    .control-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 22px rgba(255, 122, 69, 0.55);
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    /* 上一首 / 下一首：幽灵小圆钮 */
    .control-btn.mini-btn {
      width: 34px;
      height: 34px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink-dim);
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      --darkreader-inline-bgcolor: rgba(255, 255, 255, 0.08) !important;
      --darkreader-inline-color: #b8ad97 !important;
      --darkreader-inline-border: 1px solid rgba(255, 255, 255, 0.12) !important;
    }
    .control-btn.mini-btn:hover {
      color: var(--accent);
      background: rgba(255, 122, 69, 0.14);
      border-color: rgba(255, 122, 69, 0.4);
      --darkreader-inline-color: #ff7a45 !important;
      --darkreader-inline-bgcolor: rgba(255, 122, 69, 0.14) !important;
    }
    /* 均衡器动效 */
    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      width: 20px;
      opacity: 0.55;
    }
    .eq span {
      width: 3px;
      background: var(--accent-2);
      border-radius: 2px;
      animation: eq-bounce 1.1s ease-in-out infinite;
    }
    .eq span:nth-child(1) { height: 8px; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 16px; animation-delay: 0.18s; }
    .eq span:nth-child(3) { height: 11px; animation-delay: 0.36s; }
    .eq span:nth-child(4) { height: 6px; animation-delay: 0.1s; }
    @keyframes eq-bounce {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1); }
    }

    /* ===== 播放进度条：轨道 + 滑块 + 时间 ===== */
    .progress-area {
      margin-top: 14px;
    }
    .progress {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      /* 已播放部分通过 --progress 变量动态填充 */
      background: linear-gradient(to right, var(--accent-2) 0%, var(--accent-2) var(--progress, 0%), rgba(255, 255, 255, 0.14) var(--progress, 0%));
      outline: none;
      cursor: pointer;
      /* Dark Reader 豁免：保留自绘轨道颜色 */
      --darkreader-inline-background: linear-gradient(to right, #ffb454 0%, #ffb454 var(--progress, 0%), rgba(255, 255, 255, 0.14) var(--progress, 0%)) !important;
    }
    .progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid #16130c;
      box-shadow: 0 0 10px rgba(255, 180, 84, 0.55);
      transition: transform 0.15s var(--ease-out);
      --darkreader-inline-background: #ffb454 !important;
      --darkreader-inline-border: 2px solid #16130c !important;
      --darkreader-inline-boxshadow: 0 0 10px rgba(255, 180, 84, 0.55) !important;
    }
    .progress::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    .progress:focus-visible {
      box-shadow: 0 0 0 3px rgba(255, 180, 84, 0.3);
    }
    .progress::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      --darkreader-inline-background: rgba(255, 255, 255, 0.14) !important;
    }
    /* Firefox 依据 input value 自动填充已播放部分 */
    .progress::-moz-range-progress {
      height: 4px;
      border-radius: 999px;
      background: var(--accent-2);
      --darkreader-inline-background: #ffb454 !important;
    }
    .progress::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid #16130c;
      box-shadow: 0 0 10px rgba(255, 180, 84, 0.55);
      --darkreader-inline-background: #ffb454 !important;
      --darkreader-inline-border: 2px solid #16130c !important;
      --darkreader-inline-boxshadow: 0 0 10px rgba(255, 180, 84, 0.55) !important;
    }
    .progress-time {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--ink-dim);
      --darkreader-inline-color: #b8ad97 !important;
    }

    /* ===== 完整歌曲列表 ===== */
    .song-list {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .song-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, border-color 0.2s, transform 0.2s var(--ease-out);
      --darkreader-inline-bgcolor: rgba(255, 255, 255, 0.04) !important;
      --darkreader-inline-color: #f4ecdd !important;
      --darkreader-inline-border: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    .song-item:hover {
      background: rgba(255, 122, 69, 0.12);
      border-color: rgba(255, 122, 69, 0.3);
      --darkreader-inline-bgcolor: rgba(255, 122, 69, 0.12) !important;
    }
    .song-item.active {
      background: rgba(255, 122, 69, 0.16);
      border-color: rgba(255, 122, 69, 0.45);
      --darkreader-inline-bgcolor: rgba(255, 122, 69, 0.16) !important;
    }
    .song-idx {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--ink-dim);
      --darkreader-inline-color: #b8ad97 !important;
    }
    .song-name { flex: 1; font-weight: 600; }
    .song-meta {
      font-size: 11px;
      color: var(--ink-dim);
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      --darkreader-inline-color: #b8ad97 !important;
    }
    .song-state {
      width: 16px;
      text-align: center;
      color: var(--accent-2);
      --darkreader-inline-color: #ffb454 !important;
    }

    audio { display: none; }

    /* 键盘焦点可见 */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 12px;
    }

    /* ===== 小屏适配（≤ 480px）：触控友好、内容不溢出 ===== */
    @media (max-width: 480px) {
      body { padding: 12px; }
      /* 卡片：收窄内边距，圆角略减 */
      .card {
        padding: 22px 18px 20px;
        border-radius: 22px;
      }
      .card-top { margin: 0 0 14px; }
      /* 头像：小幅缩小，外环按比例收缩 */
      .avatar-wrap { width: 104px; height: 104px; margin: 2px auto 14px; }
      .avatar-ring { inset: -6px; }
      .avatar { width: 104px; height: 104px; }
      .name { font-size: 26px; }
      .sign { font-size: 12px; letter-spacing: 1.5px; margin-bottom: 18px; }
      .tags { gap: 6px; margin-bottom: 20px; }
      .tag { padding: 5px 10px 5px 7px; font-size: 12px; }
      .links { gap: 8px; margin-bottom: 18px; }
      /* 按钮：保持 ≥44px 触摸高度 */
      .btn { padding: 13px 14px; min-height: 48px; font-size: 14px; }
      /* 番单面板：收窄内边距，条目保持可点按高度 */
      .fav-panel { padding: 14px 12px 6px; }
      .fav-item { padding: 11px 12px; }
      /* 播放器：标题字号略降，进度条加粗放大滑块便于触控 */
      .music-player { padding-top: 14px; }
      .now-label { margin-bottom: 8px; }
      .music-title { font-size: 13px; }
      .music-title small { font-size: 10.5px; }
      .control-btn { width: 44px; height: 44px; }
      .control-btn.mini-btn { width: 32px; height: 32px; }
      .progress { height: 6px; }
      .progress::-webkit-slider-thumb { width: 20px; height: 20px; }
      .progress::-moz-range-thumb { width: 20px; height: 20px; }
      .progress::-moz-range-track { height: 6px; }
      .progress::-moz-range-progress { height: 6px; }
      .progress-time { font-size: 10.5px; }
      /* 歌曲列表：行高增大、元信息收窄，方便点按 */
      .song-list { gap: 6px; margin-top: 12px; }
      .song-item { padding: 12px; min-height: 44px; }
      .song-meta { max-width: 45%; }
    }

    /* 动效降级：尊重系统的"减少动态效果"偏好 */
    @media (prefers-reduced-motion: reduce) {
      .avatar-ring { animation: none; }
      .eq span { animation: none; }
      .bg-slide { transition: opacity 0.3s ease-in-out !important; }
      .btn, .control-btn, .arrow { transition: none; }
    }
  </style>
</head>

<body>
  <!-- 关键：添加data-darkreader-ignore属性，让Dark Reader完全忽略轮播层 -->
  <!-- 性能优化：所有背景图统一 data-bg 懒加载（轮播前一刻才请求），避免无 data-bg 被覆盖为 url('undefined') -->
  <div class="bg-slider" data-darkreader-ignore>
    <div class="bg-slide active" data-bg="https://cdn.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/assets/bg/bg1.webp"></div>
    <div class="bg-slide" data-bg="https://cdn.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/assets/bg/bg2.webp"></div>
    <div class="bg-slide" data-bg="https://cdn.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/assets/bg/bg3.webp"></div>
    <div class="bg-slide" data-bg="https://cdn.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/assets/bg/bg4.webp"></div>
    <div class="bg-slide" data-bg="https://cdn.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/assets/bg/bg5.webp"></div>
    <div class="bg-slide" data-bg="https://cdn.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/assets/bg/bg6.webp"></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-top">
        <span class="rec">REC</span>
        <span class="no">NO.1902</span>
      </div>

      <div class="avatar-wrap">
        <span class="avatar-ring" aria-hidden="true"></span>
        <img class="avatar" src="https://img.cdn1.vip/i/69c380c30640c_1774420163.jpg" alt="Lsh1902 的头像" width="128" height="128" />
      </div>

      <h1 class="name">Welcome<span class="dot">!</span></h1>
      <p class="sign">二次元爱好者 · 安静看番，认真生活</p>

      <div class="tags">
        <span class="tag"><span class="no">01</span>动漫</span>
        <span class="tag"><span class="no">02</span>ACG</span>
        <span class="tag"><span class="no">03</span>三角洲</span>
        <span class="tag"><span class="no">04</span>日常</span>
      </div>

      <div class="links">
        <a href="https://space.bilibili.com/1895587617" target="_blank" rel="noopener" class="btn btn-bilibili">
          <span class="idx">01</span><span class="label">B站主页</span><span class="arrow">→</span>
        </a>
        <a href="javascript:void(0)" class="btn btn-love" id="favoriteBtn" aria-expanded="false" aria-controls="favPanel">
          <span class="idx">02</span><span class="label">我的番单</span><span class="arrow">→</span>
        </a>
        <!-- 番单面板：点击「我的番单」展开，面板紧跟按钮下方 -->
        <div class="fav-panel" id="favPanel" hidden>
          <div class="fav-group">
            <div class="fav-group-title">魔法禁书目录系列</div>
            <a href="https://www.bilibili.com/bangumi/play/ss963" target="_blank" rel="noopener" class="fav-item">
              <span class="fav-idx">01</span><span class="fav-name">魔法禁书目录 第一季</span><span class="arrow">→</span>
            </a>
            <a href="https://www.bilibili.com/bangumi/play/ss964" target="_blank" rel="noopener" class="fav-item">
              <span class="fav-idx">02</span><span class="fav-name">魔法禁书目录 Ⅱ</span><span class="arrow">→</span>
            </a>
            <a href="https://www.bilibili.com/bangumi/play/ss25617" target="_blank" rel="noopener" class="fav-item">
              <span class="fav-idx">03</span><span class="fav-name">魔法禁书目录 Ⅲ</span><span class="arrow">→</span>
            </a>
          </div>
          <div class="fav-group">
            <div class="fav-group-title">某科学的超电磁炮系列</div>
            <a href="https://www.bilibili.com/bangumi/play/ss425" target="_blank" rel="noopener" class="fav-item">
              <span class="fav-idx">04</span><span class="fav-name">某科学的超电磁炮</span><span class="arrow">→</span>
            </a>
            <a href="https://www.bilibili.com/bangumi/play/ss427" target="_blank" rel="noopener" class="fav-item">
              <span class="fav-idx">05</span><span class="fav-name">某科学的超电磁炮 S</span><span class="arrow">→</span>
            </a>
            <a href="https://www.bilibili.com/bangumi/play/ss29325" target="_blank" rel="noopener" class="fav-item">
              <span class="fav-idx">06</span><span class="fav-name">某科学的超电磁炮 T</span><span class="arrow">→</span>
            </a>
          </div>
        </div>
        <a href="https://github.com/Lsh1902" target="_blank" rel="noopener" class="btn btn-github">
          <span class="idx">03</span><span class="label">GitHub</span><span class="arrow">→</span>
        </a>
      </div>

      <div class="music-player">
        <div class="now-label">Now Playing</div>
        <div class="music-row">
          <button class="control-btn mini-btn" id="prevBtn" aria-label="上一首" title="上一首">⏮</button>
          <button class="control-btn" id="playBtn" aria-label="播放或暂停背景音乐" aria-pressed="false">▶</button>
          <div class="music-title">
            <span id="trackName">AIZO</span>
            <small id="trackMeta">King Gnu · 咒术回战：死灭回游 OP</small>
          </div>
          <div class="eq" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <button class="control-btn mini-btn" id="nextBtn" aria-label="下一首" title="下一首">⏭</button>
        </div>
        <!-- 进度条：显示当前时间/总时长，支持点击与拖动 seek（--progress 变量驱动已播放填充） -->
        <div class="progress-area">
          <input type="range" class="progress" id="progress" min="0" max="100" value="0" step="0.1"
                 aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" />
          <div class="progress-time">
            <span id="timeCurrent">0:00</span>
            <span id="timeTotal">0:00</span>
          </div>
        </div>
        <!-- preload="auto"：进入网站即开始加载音频，点击播放时无需等待下载 -->
        <audio id="bgm" preload="auto"></audio>
        <!-- 完整歌曲列表：支持点击任意曲目直接切换 -->
        <ul class="song-list" id="songList" aria-label="歌曲列表"></ul>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════ 播放器模块 ═══════════ */
    // —— 1. 元素引用 ——
    const bgm = document.getElementById('bgm');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackName = document.getElementById('trackName');
    const trackMeta = document.getElementById('trackMeta');
    const eqBars = document.querySelectorAll('.eq span');
    const songList = document.getElementById('songList');
    const progress = document.getElementById('progress');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');

    // —— 2. 播放列表与状态 ——
    const MUSIC_BASE = 'https://cdn.jsdelivr.net/gh/Lsh1902/Lsh1902.github.io@main/assets/music/';
    const playlist = [
      { src: MUSIC_BASE + 'song1.m4a', name: 'AIZO', meta: 'King Gnu · 咒术回战：死灭回游 OP' },
      { src: MUSIC_BASE + 'song2.m4a', name: '飞行艇', meta: 'King Gnu' },
      { src: MUSIC_BASE + 'song3.m4a', name: '一无所有', meta: '尼古喵喵' },
      { src: MUSIC_BASE + 'song4.m4a', name: '中国人会飞', meta: '揽佬SKAI · Chalky Wong' }
    ];
    let current = 0;        // 当前曲目索引
    let isPlaying = false;  // 是否正在播放
    let isSeeking = false;  // 是否正在拖动进度条（拖动期间暂停 UI 同步）

    // —— 3. 进度条：时间格式化 / 同步 / 重置 / seek ——
    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      sec = Math.floor(sec);
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }
    function updateProgressUI() {
      const dur = bgm.duration || 0;
      const cur = bgm.currentTime || 0;
      const pct = dur ? (cur / dur) * 100 : 0;
      progress.value = pct;
      progress.style.setProperty('--progress', pct + '%');
      progress.setAttribute('aria-valuenow', String(Math.round(pct)));
      timeCurrent.textContent = formatTime(cur);
      timeTotal.textContent = formatTime(dur);
    }
    function resetProgress() {
      isSeeking = false;
      progress.value = 0;
      progress.style.setProperty('--progress', '0%');
      progress.setAttribute('aria-valuenow', '0');
      timeCurrent.textContent = '0:00';
      timeTotal.textContent = '0:00';
    }
    function onSeek() {
      if (!bgm.duration) return;
      isSeeking = true;
      const t = (progress.value / 100) * bgm.duration;
      bgm.currentTime = t;
      timeCurrent.textContent = formatTime(t);
    }

    // —— 4. 曲目加载与播放控制 ——
    function loadTrack(idx, autoplay) {
      current = (idx + playlist.length) % playlist.length;
      bgm.src = playlist[current].src;
      trackName.textContent = playlist[current].name;
      trackMeta.textContent = playlist[current].meta;
      resetProgress(); // 切换曲目时重置进度条
      if (typeof updateSongActive === 'function') updateSongActive();
      if (autoplay) {
        // 部分浏览器对自动播放有限制，捕获 reject 避免报错
        const p = bgm.play();
        if (p && p.catch) p.catch(() => {});
      }
    }
    function setPlaying(state) {
      isPlaying = state;
      playBtn.textContent = state ? '⏸' : '▶';
      playBtn.setAttribute('aria-pressed', String(state));
      // 均衡器随播放状态启停
      eqBars.forEach((b) => { b.style.animationPlayState = state ? 'running' : 'paused'; });
      if (typeof updateSongActive === 'function') updateSongActive();
    }
    function togglePlay() {
      if (!bgm.src) { loadTrack(0, true); setPlaying(true); return; }
      if (isPlaying) {
        bgm.pause();
        setPlaying(false);
      } else {
        const p = bgm.play();
        if (p && p.catch) p.catch(() => {});
        setPlaying(true);
      }
    }

    // —— 5. 事件绑定 ——
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => { loadTrack(current - 1, true); setPlaying(true); });
    nextBtn.addEventListener('click', () => { loadTrack(current + 1, true); setPlaying(true); });
    // 一首播完自动切下一首，形成连续播放列表
    bgm.addEventListener('ended', () => { loadTrack(current + 1, true); setPlaying(true); });
    // 元数据就绪 / 播放过程中实时同步进度条（拖动期间跳过）
    bgm.addEventListener('loadedmetadata', updateProgressUI);
    bgm.addEventListener('timeupdate', () => { if (!isSeeking) updateProgressUI(); });
    // 点击 / 拖动进度条 seek；松开时结束拖动状态
    progress.addEventListener('input', onSeek);
    progress.addEventListener('change', () => { isSeeking = false; });

    // —— 6. 初始化：载入第一首曲目信息（不自动播放，但立即开始加载音频） ——
    loadTrack(0, false);
    bgm.load();

    // "我的番单"按钮：展开/收起番单面板（魔法禁书目录 & 超电磁炮系列，附B站链接）
    const favoriteBtn = document.getElementById('favoriteBtn');
    const favPanel = document.getElementById('favPanel');
    if (favoriteBtn && favPanel) {
      favoriteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const opening = favPanel.hidden;
        favPanel.hidden = !opening;
        favoriteBtn.setAttribute('aria-expanded', String(opening));
        favoriteBtn.querySelector('.label').textContent = opening ? '收起番单' : '我的番单';
        favoriteBtn.querySelector('.arrow').textContent = opening ? '↑' : '→';
      });
    }

    // 完整歌曲列表：渲染所有曲目，支持点击任意歌曲直接切换
    function updateSongActive() {
      if (!songList) return;
      const items = songList.querySelectorAll('.song-item');
      items.forEach((el, i) => {
        const on = (i === current);
        el.classList.toggle('active', on);
        const st = el.querySelector('.song-state');
        if (st) st.textContent = (on && isPlaying) ? '♪' : '';
      });
    }
    function renderPlaylist() {
      if (!songList) return;
      songList.innerHTML = '';
      playlist.forEach((t, i) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'song-item';
        btn.setAttribute('aria-label', '播放 ' + t.name);
        btn.innerHTML =
          '<span class="song-idx">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="song-name">' + t.name + '</span>' +
          '<span class="song-meta">' + t.meta + '</span>' +
          '<span class="song-state"></span>';
        btn.addEventListener('click', () => {
          if (i === current) {
            // 点击当前曲目：播放/暂停切换
            if (isPlaying) {
              bgm.pause();
              setPlaying(false);
            } else {
              const p = bgm.play();
              if (p && p.catch) p.catch(() => {});
              setPlaying(true);
            }
          } else {
            loadTrack(i, true);
            setPlaying(true);
          }
          updateSongActive();
        });
        li.appendChild(btn);
        songList.appendChild(li);
      });
      updateSongActive();
    }
    renderPlaylist();

    // 背景轮播逻辑（懒加载优化版）
    const slides = document.querySelectorAll('.bg-slide');
    let currentSlide = 0;
    let timer = null;
    const SLIDE_INTERVAL = 5000;

    function applyBg(idx) {
      const s = slides[idx];
      // 仅对带 data-bg 的幻灯片设置背景，避免无 data-bg 被覆盖成 url('undefined')
      if (s && s.dataset.bg && !s.dataset.loaded) {
        s.style.backgroundImage = "url('" + s.dataset.bg + "')";
        s.dataset.loaded = '1';
      }
    }

    function goTo(idx) {
      applyBg(idx);
      slides.forEach((s, i) => s.classList.toggle('active', i === idx));
      currentSlide = idx;
      // 预先缓存下一张，切换时无需等待下载
      const next = (idx + 1) % slides.length;
      const nextEl = slides[next];
      if (nextEl && nextEl.dataset.bg && !nextEl.dataset.loaded) {
        const img = new Image();
        img.src = nextEl.dataset.bg;
      }
    }

    function nextSlide() {
      goTo((currentSlide + 1) % slides.length);
    }

    function startSlider() {
      if (timer) return;
      timer = setInterval(nextSlide, SLIDE_INTERVAL);
    }

    function stopSlider() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    if (slides.length > 0) {
      // 首屏显示 bg1，轮播正常从 bg1 开始
      goTo(0);
      startSlider();
      // 页面在后台时暂停轮播，减少无谓的图片加载与性能消耗
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopSlider(); else startSlider();
      });
    }
  </script>
</body>
