name = "lsh-admin-api"
main = "src/index.js"
compatibility_date = "2025-08-01"

# 部署时在 Cloudflare Dashboard（Workers -> lsh-admin-api -> Settings -> Variables）
# 或 `wrangler secret put ADMIN_KEY` / `wrangler secret put GITHUB_TOKEN` 注入：
#   ADMIN_KEY    - 管理密钥，admin.html 请求头 X-Admin-Key 需与之匹配
#   GITHUB_TOKEN - 具有 Lsh1902/Lsh1902.github.io 仓库 Contents 写入权限的 PAT
